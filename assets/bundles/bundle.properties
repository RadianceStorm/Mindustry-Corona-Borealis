# This is the visual name bundle for literally everything in the mod.
# (so that quartz isn't called "corona-borealis-quartz" anymore)

##==-- ITEMS --==##
item.corona-borealis-coronite.name = Coronite

item.corona-borealis-quartz.name = Quartz
item.corona-borealis-basalt.name = Basalt

item.corona-borealis-citrine.name = Citrine
item.corona-borealis-azurite.name = Azurite

#=- Item Descriptions -=#
item.corona-borealis-coronite.description = A common mineral found under the surface of the planet Corona Borealis. It seems to appear on the dayside and nightside equally, and contains traces of unpolarized arcane energy. Due to its neutral polarity, it acts as an excellent insulator for arcane energy.

item.corona-borealis-quartz.description = Stone tempered by the fiery light of the sun. Consists solely of silicon and oxygen. Analysis shows that it contains trace amounts of polarized arcane energy, likely due to intense stellar radiation exposure on the light side of the tidally locked planet.
item.corona-borealis-basalt.description = Stone transformed by the gentle light of the moon and a thousand distant stars. Rich with silicon and various metals. Analysis shows that it contains trace amounts of polarized arcane energy, despite being on the dark side of the planet. This indicates that arcane radiation may penetrate the entire planet, possibly due to weak interaction with normal matter.

item.corona-borealis-citrine.description = A gleaming yellow gemstone with high levels of light arcane energy. A perfect medium for channeling arcane magic, as well as various other industrial uses.
item.corona-borealis-azurite.description = A glowing blue gemstone with high levels of dark arcane energy. A perfect medium for channeling arcane magic, as well as various other industrial uses.



##==-- LIQUIDS --==##

liquid.corona-borealis-starblood.name = Starblood
liquid.corona-borealis-vesper.name = Vesper

#=- Liquid Descriptions -=#
liquid.corona-borealis-starblood.description = A silicon-based oil similar to PDMS. Found on the dayside. Due to its chemical composition, it interacts with arcane energy at a high rate. It's also an excellent dielectric insulator, coolant, and lubricant.
liquid.corona-borealis-vesper.description = A flammable liquid similar to Trisilane. Found on the nightside. It emits a faint blue glow due to notable traces of arcane energy. It is highly reactive, and serves as an excellent fuel for combustion.